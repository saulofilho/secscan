<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Dark Cyber Shield Background -->
  <defs>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#18181B" />
      <stop offset="50%" stopColor="#09090B" />
      <stop offset="100%" stopColor="#000000" />
    </linearGradient>
    <linearGradient id="neonOrangeGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#FF6B35" />
      <stop offset="100%" stopColor="#FF3E00" />
    </linearGradient>
    <linearGradient id="laserGreenGrad" x1="0" y1="0" x2="64" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#00FF41" stopOpacity="0" />
      <stop offset="50%" stopColor="#00FF41" stopOpacity="1" />
      <stop offset="100%" stopColor="#00FF41" stopOpacity="0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Cyber Border -->
  <path 
    d="M32 4 L56 14 V32 C56 46 44 57 32 60 C20 57 8 46 8 32 V14 Z" 
    fill="url(#shieldGrad)" 
    stroke="url(#neonOrangeGrad)" 
    stroke-width="3" 
    stroke-linejoin="round"
  />

  <!-- Internal Circuit & Armor Lines -->
  <path 
    d="M32 10 L50 18 V31 C50 42 41 51 32 54 C23 51 14 42 14 31 V18 Z" 
    fill="#0A0A0E" 
    stroke="#27272A" 
    stroke-width="1.5"
  />

  <!-- High-Tech Central Emblem (Alert / Scan Crosshair) -->
  <path 
    d="M32 20 L44 38 H20 Z" 
    fill="none" 
    stroke="#FF3E00" 
    stroke-width="2.5" 
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- Central Exclamation / Core Indicator -->
  <circle cx="32" cy="33.5" r="1.8" fill="#FFFFFF" />
  <line x1="32" y1="26" x2="32" y2="29.5" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" />

  <!-- Laser Radar Scan Line -->
  <line x1="12" y1="36" x2="52" y2="36" stroke="url(#laserGreenGrad)" stroke-width="2" />
  
  <!-- Corner Tech Accent Dots -->
  <circle cx="32" cy="7" r="1.5" fill="#00FF41" />
  <circle cx="16" cy="18" r="1.2" fill="#FF3E00" />
  <circle cx="48" cy="18" r="1.2" fill="#FF3E00" />
</svg>
